# Netlify configuration for the FSO marketing site
# On every push to the connected GitHub repo, Netlify runs build.py (pure
# Python, standard library only) and publishes the generated public/ folder.
[build]
  command = "python3 build.py"
  publish = "public"

# Security + performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Images/fonts rarely change and are safe to cache long-term
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# JS/CSS change in place (same filename), so they must revalidate every load
# to guarantee visitors always get the current version after a redeploy.
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Pretty URLs: /about -> /about.html
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
[[redirects]]
  from = "/standard"
  to = "/standard.html"
  status = 200
[[redirects]]
  from = "/certification"
  to = "/certification.html"
  status = 200
[[redirects]]
  from = "/professionals"
  to = "/professionals.html"
  status = 200
[[redirects]]
  from = "/diagnostic"
  to = "/diagnostic.html"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# Custom 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
